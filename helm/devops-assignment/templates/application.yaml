apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-assignment
  namespace: {{ .Values.namespaces.application }}
  labels:
    app.kubernetes.io/name: devops-assignment
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: devops-home-assignment
spec:
  replicas: {{ .Values.application.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-assignment
  template:
    metadata:
      annotations:
        devops-assignment.io/rollout-token: {{ .Values.rolloutToken | quote }}
      labels:
        app.kubernetes.io/name: devops-assignment
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: devops-home-assignment
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          {{- if .Values.application.image.digest }}
          image: "{{ .Values.application.image.repository }}@{{ .Values.application.image.digest }}"
          {{- else }}
          image: "{{ .Values.application.image.repository }}:{{ .Values.application.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.application.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: READY_DELAY_MS
              value: "2000"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 12
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.application.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: devops-assignment
  namespace: {{ .Values.namespaces.application }}
  labels:
    app.kubernetes.io/name: devops-assignment
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: devops-home-assignment
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "3000"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: devops-assignment
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: {{ .Values.application.service.nodePort }}
      protocol: TCP

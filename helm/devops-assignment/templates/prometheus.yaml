apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Values.namespaces.observability }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-home-assignment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-assignment-prometheus
  namespace: {{ .Values.namespaces.application }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-home-assignment
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-assignment-prometheus
  namespace: {{ .Values.namespaces.application }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-home-assignment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devops-assignment-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Values.namespaces.observability }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespaces.observability }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-home-assignment
data:
  prometheus.yml: |
{{ tpl (.Files.Get "files/prometheus.yml") . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespaces.observability }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: devops-home-assignment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      annotations:
        devops-assignment.io/rollout-token: {{ .Values.rolloutToken | quote }}
        checksum/config: {{ tpl (.Files.Get "files/prometheus.yml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: devops-home-assignment
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.namespaces.observability }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-home-assignment
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: {{ .Values.prometheus.service.nodePort }}
      protocol: TCP

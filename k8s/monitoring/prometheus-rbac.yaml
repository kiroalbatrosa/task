apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-home-assignment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-assignment-prometheus
  namespace: app
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-home-assignment
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-assignment-prometheus
  namespace: app
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-home-assignment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devops-assignment-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
